name: Release

on:
  push:
    tags:
    - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --check
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Run tests
      run: cargo test

  publish:
    name: publish-github-release
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build source bundle
      shell: bash
      run: |
        set -euo pipefail
        name="moxi-agent-${GITHUB_REF_NAME}"
        mkdir -p "dist/${name}"
        cp Cargo.toml Cargo.lock README.md LICENSE "dist/${name}/"
        cp -R crates docs assets "dist/${name}/"
        tar -czf "dist/${name}.tar.gz" -C dist "${name}"
        (
          cd dist
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
        )
    - name: Publish release assets
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if gh release view "${TAG}" >/dev/null 2>&1; then
          gh release upload "${TAG}" dist/*.tar.gz dist/*.sha256 --clobber
        else
          gh release create "${TAG}" dist/*.tar.gz dist/*.sha256 \
            --title "${TAG}" \
            --notes "MOXI Agent ${TAG}: core contracts, policy, sandbox, and ledger source bundle."
        fi
