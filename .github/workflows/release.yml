name: Release

on:
  push:
    tags:
    - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          suffix: x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
          binary: essence
          archive: tar.gz
        - os: windows-latest
          suffix: x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          binary: essence.exe
          archive: zip
        - os: macos-13
          suffix: x86_64-apple-darwin
          target: x86_64-apple-darwin
          binary: essence
          archive: tar.gz
        - os: macos-latest
          suffix: aarch64-apple-darwin
          target: aarch64-apple-darwin
          binary: essence
          archive: tar.gz

    steps:
    - uses: actions/checkout@v6.0.2
    - name: Add Rust target
      run: rustup target add ${{ matrix.target }}
    - name: Build release binary
      run: cargo build --release -p essence-core --bin essence --target ${{ matrix.target }}
    - name: Package Unix binary
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        name="essence-${GITHUB_REF_NAME}-${{ matrix.suffix }}"
        mkdir -p "dist/${name}"
        cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${name}/"
        cp README.md LICENSE "dist/${name}/"
        tar -czf "dist/${name}.${{ matrix.archive }}" -C dist "${name}"
        (
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.${{ matrix.archive }}" > "${name}.${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${name}.${{ matrix.archive }}" > "${name}.${{ matrix.archive }}.sha256"
          fi
        )
    - name: Package Windows binary
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $name = "essence-${env:GITHUB_REF_NAME}-${{ matrix.suffix }}"
        New-Item -ItemType Directory -Force "dist/$name" | Out-Null
        Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
        Copy-Item README.md, LICENSE "dist/$name/"
        Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.${{ matrix.archive }}" -Force
        $hash = Get-FileHash "dist/$name.${{ matrix.archive }}" -Algorithm SHA256
        "$($hash.Hash.ToLower())  $name.${{ matrix.archive }}" | Set-Content "dist/$name.${{ matrix.archive }}.sha256"
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: essence-${{ matrix.suffix }}
        path: |
          dist/*.tar.gz
          dist/*.zip
          dist/*.sha256
        if-no-files-found: error

  publish:
    name: publish-github-release
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        path: dist
        merge-multiple: true
    - name: Publish release assets
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if gh release view "${TAG}" >/dev/null 2>&1; then
          gh release upload "${TAG}" dist/* --clobber
        else
          gh release create "${TAG}" dist/* \
            --title "${TAG}" \
            --notes "Automated Essence Agent release binaries for Linux, Windows, and macOS."
        fi
