[package]
name = "essence-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core protocol and WAL primitives for Essence Agent."

[features]
default = ["full"]
full = ["api", "gitnexus", "mcp", "swarm", "workspace"]
api = []
gitnexus = []
mcp = ["api", "swarm"]
swarm = []
workspace = []

[dependencies]
clap = { version = "4", features = ["derive"] }
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
ureq = "2"
uuid.workspace = true
